# 运动检索改进的离线实验
# 不改正式 GRAE 在线跟踪器，不训练知识融合网络，不覆盖上一轮结果

project:
  data_root: data/v2x-seq-infrastructure
  converted_root: data/converted/v2x_seq_infrastructure
  map_root: data/v2x_seq_maps
  output_root: outputs/research/knowledge_retrieval_v2

split_file: configs/datasets/v2xseq_sequence_split.json
fold_file: configs/research/v2xseq_train_folds.json
scene_difficulty_root: outputs/analysis/scene_difficulty
scene_difficulty_config: configs/analysis/v2xseq_scene_difficulty.yaml
source_tracks: outputs/research/knowledge_retrieval/cache/tracks.pkl
source_motion: outputs/research/knowledge_retrieval/kb/motion
lane_cache: outputs/research/knowledge_retrieval/cache

detection_root: outputs/centerpoint/detections
grae_config: configs/analysis/grae_geometry_reliability.yaml
tracker_config: configs/trackers/grae/centerpoint.yaml
checkpoint: outputs/grae_centerpoint/ckpt/checkpoint-best.pth
baseline_prediction_root: outputs/grae_centerpoint/predictions

vehicle_classes: [Car, Van, Bus, Truck]
operating_score: 0.47854848529411764
match_iou: 0.25
match_center_gate_m: 20.0

history_s: 1.0
future_s: 2.0
dt_s: 0.1
sample_tolerance_s: 0.12
segment_gap_s: 0.3
speed_limit_m_s: 40.0
horizons_s: [0.5, 1.0, 2.0]

retrieval:
  top_k: 5
  spatial_sigma_m: 12.0
  motion_sigma_m: 1.5
  speed_sigma_m_s: 2.0
  heading_sigma_deg: 30.0
  yaw_sigma_deg_s: 20.0
  region_penalty: 2.0
  successor_penalty: 0.5
  lane_radius_m: 8.0
  spatial_gate_m: 60.0
  gates_m: [10.0, 25.0, 60.0]
  residual_cost_max: 3.5
  residual_endpoint_std_m: 2.5

motion:
  static_speed_m_s: 0.5
  static_disp_m: 1.0
  turn_yaw_deg: 20.0
  turn_lateral_m: 3.0
  heading_speed_m_s: 1.0
  speed_change_m_s: 1.0

reliability:
  hard_fraction: 0.2

association:
  device: cuda
  alpha: 0.24
  high_cost_limit: 0.9
  low_cost_limit: 0.8
  gap_edges_s: [0.0, 0.15, 0.5, 1.0, 100.0]
  ambiguous_margin: 0.05
  near_negative_m: 4.0
  dropout_frames: [3, 5, 10]
