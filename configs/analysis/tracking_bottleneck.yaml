project:
  data_root: data/v2x-seq-infrastructure
  converted_root: data/converted/v2x_seq_infrastructure
  output_root: outputs/analysis/tracking_bottleneck

split_file: configs/datasets/v2xseq_sequence_split.json
detection_root: outputs/centerpoint/detections

pose_translation_tolerance_m: 0.2
pose_rotation_l2_tolerance: 0.02

bev:
  x_min: 0.0
  x_max: 100.0
  y_min: -39.68
  y_max: 39.68

grid_m: 5.0
min_observations: 20
prior_strength: 20.0
hard_fraction: 0.2
match_iou: 0.25
match_center_gate_m: 20.0
good_detection_iou: 0.5
good_detection_center_m: 2.0

trackers:
  - name: AB3DMOT
    kind: classic
    config: configs/trackers/ab3dmot/centerpoint.yaml
    prediction_root: outputs/ab3dmot_centerpoint/predictions
    evaluation: outputs/ab3dmot_centerpoint/evaluation/metrics.json
  - name: SimpleTrack
    kind: classic
    config: configs/trackers/simpletrack/centerpoint.yaml
    prediction_root: outputs/simpletrack_centerpoint/predictions
    evaluation: outputs/simpletrack_centerpoint/evaluation/metrics.json
  - name: GRAE-3DMOT
    kind: grae
    config: configs/trackers/grae/centerpoint.yaml
    prediction_root: outputs/grae_centerpoint/predictions
    evaluation: outputs/grae_centerpoint/evaluation/metrics.json
