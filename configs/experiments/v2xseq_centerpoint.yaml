dataset: configs/datasets/v2xseq.yaml
detector: configs/detectors/centerpoint/v2xseq.yaml
birth_thresholds: configs/experiments/centerpoint_score_thresholds.yaml
protocol: v2xseq
output: outputs/benchmark/v2xseq_centerpoint.csv
trackers:
  - name: AB3DMOT
    config: configs/trackers/ab3dmot/centerpoint.yaml
    kind: classic
  - name: SimpleTrack
    config: configs/trackers/simpletrack/centerpoint.yaml
    kind: classic
  - name: ImmortalTracker
    config: configs/trackers/immortal/centerpoint.yaml
    kind: classic
  - name: Fast-Poly
    config: configs/trackers/fastpoly/centerpoint.yaml
    run_config: outputs/fastpoly_centerpoint/calibration/best_config.yaml
    kind: classic
  - name: 3DMOTFormer
    config: configs/trackers/3dmotformer/centerpoint.yaml
    kind: motformer
  - name: GRAE-3DMOT
    config: configs/trackers/grae/centerpoint.yaml
    kind: grae
