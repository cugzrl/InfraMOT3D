DATASET: 'ResolveDataset'
DATA_PATH: '../../../data/resolve'
RAW_ROOT: '/home/kemove/devdata1/zrl/dataset/RESOLVE'
RESOLUTION: '128'

# 与官方 sunlakes_dataset.yaml 一致的范围
POINT_CLOUD_RANGE: [-60, -60, -8.0, 88.8, 88.8, 0]

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [infos/resolve_infos_train.pkl],
    'test': [infos/resolve_infos_val.pkl]
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['placeholder']
    AUG_CONFIG_LIST:
        - NAME: gt_sampling
          DB_INFO_PATH:
              - resolve_dbinfos_train_128.pkl
          PREPARE: {
             filter_by_min_points: [
                 'car:5','truck:5', 'construction_vehicle:5', 'bus:5', 'trailer:5',
                 'barrier:5', 'motorcycle:5', 'bicycle:5', 'pedestrian:5', 'traffic_cone:5'
             ],
          }
          SAMPLE_GROUPS: [
              'car:2','truck:3', 'construction_vehicle:4', 'bus:4', 'trailer:4',
              'barrier:3', 'motorcycle:5', 'bicycle:5', 'pedestrian:6', 'traffic_cone:3'
          ]
          NUM_POINT_FEATURES: 4
          DATABASE_WITH_FAKELIDAR: False
          REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
          LIMIT_WHOLE_SCENE: True

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity'],
    src_feature_list: ['x', 'y', 'z', 'intensity'],
}

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True

    - NAME: shuffle_points
      SHUFFLE_ENABLED: {
        'train': True,
        'test': False
      }

    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.3, 0.3, 0.2]
      MAX_POINTS_PER_VOXEL: 20
      MAX_NUMBER_OF_VOXELS: {
        'train': 120000,
        'test': 160000
      }
