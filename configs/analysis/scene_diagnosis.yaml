project:
  data_root: data/v2x-seq-infrastructure
  converted_root: data/converted/v2x_seq_infrastructure
  output_root: outputs/analysis/scene_diagnosis

split_file: configs/datasets/v2xseq_sequence_split.json
detection_root: outputs/centerpoint/detections

bev:
  x_min: 0.0
  x_max: 100.0
  y_min: -39.68
  y_max: 39.68

grid_sizes: [5.0, 2.0]
primary_grid: 5.0
min_observations:
  "2": 5
  "5": 20
prior_strength: 20.0
hard_fraction: 0.2
consensus_thresholds: [2, 3, 4, 5]

pose_translation_tolerance_m: 0.2
pose_rotation_l2_tolerance: 0.02
iou_threshold: 0.25
match_center_gate_m: 20.0
localization_good_iou: 0.5
localization_good_center_m: 2.0
candidate_radius_m: 5.0
local_density_radius_m: 10.0
ambiguity_margin_m: 1.0
large_post_residual_m: 1.0

figure_scene: yizhuang09_lidar151
figure_target_sequence: "0059"

trackers:
  - name: AB3DMOT
    prediction_root: outputs/ab3dmot_centerpoint/predictions
  - name: SimpleTrack
    prediction_root: outputs/simpletrack_centerpoint/predictions
  - name: GRAE-3DMOT
    prediction_root: outputs/grae_centerpoint/predictions
  - name: Fast-Poly
    prediction_root: outputs/analysis/scene_diagnosis/predictions/fastpoly
  - name: 3DMOTFormer
    prediction_root: outputs/analysis/scene_diagnosis/predictions/3dmotformer
