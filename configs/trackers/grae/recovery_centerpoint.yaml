project:
  seed: 0
  data_root: data/v2x-seq-infrastructure
  converted_root: data/converted/v2x_seq_infrastructure
  output_root: outputs/experiments/grae_roadside_discovery
  detection_root: outputs/centerpoint/detections
  grae_root: third_party/GRAE-3DMOT
  grae_data_root: data/grae_v2xseq

split_file: configs/datasets/v2xseq_sequence_split.json

classes:
  - Car
  - Van
  - Bus
  - Truck
  - Pedestrian
  - Cyclist
  - Motorcyclist
  - Barrowlist

num_classes: 8

input:
  type: detection
  detection_root: outputs/centerpoint/detections

model:
  in_channels: 128
  layers: 3

train:
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.0
  epochs: 4
  clip_len: 10
  clip_stride: 3
  score_threshold: 0.01
  hard_distance: 8.0
  calibration_sequences: ["0078", "0087", "0093", "0094"]
  frozen_score_threshold: 0.47854848529411764

tracker:
  association_alpha: 0.24
  score_floor: 0.01
  birth_thresholds_file: configs/experiments/centerpoint_score_thresholds.yaml
  age: 12
  class_compat: exact
  motion_mode: zero
