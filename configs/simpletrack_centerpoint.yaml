project:
  seed: 0
  data_root: data/v2x-seq-infrastructure
  converted_root: data/converted/v2x_seq_infrastructure
  output_root: outputs/simpletrack_centerpoint

split_file: configs/v2xseq_sequence_split.json

input:
  type: detection
  detection_root: outputs/centerpoint/detections

tracker:
  name: SimpleTrack
  score_threshold: 0.1
  frame_dt: 0.1
  motion:
    p_scale: 10.0
    velocity_p_scale: 1000.0
    q_scale: 1.0
    r_scale: 1.0
    score_decay: 0.01
  vehicle:
    classes: [Car, Van, Bus, Truck]
    association: bipartite
    metric: giou
    threshold: 1.5
    min_hits: 3
    max_age: 2
    commit_modes: [1, 3]
    output_rule: associated_or_birth
    redundancy:
      mode: mm
      det_score_threshold: 0.01
      det_dist_threshold: -0.5
  pedestrian:
    classes: [Pedestrian]
    association: bipartite
    metric: giou
    threshold: 1.5
    min_hits: 3
    max_age: 2
    commit_modes: [1, 3]
    output_rule: associated_or_birth
    redundancy:
      mode: mm
      det_score_threshold: 0.01
      det_dist_threshold: -0.5
  cyclist:
    classes: [Cyclist, Motorcyclist, Barrowlist]
    association: bipartite
    metric: giou
    threshold: 1.5
    min_hits: 3
    max_age: 2
    commit_modes: [1, 3]
    output_rule: associated_or_birth
    redundancy:
      mode: mm
      det_score_threshold: 0.01
      det_dist_threshold: -0.5

evaluation:
  iou_thresholds:
    Car: 0.5
    Van: 0.5
    Bus: 0.5
    Truck: 0.5
    Pedestrian: 0.25
    Cyclist: 0.25
    Motorcyclist: 0.25
    Barrowlist: 0.25
