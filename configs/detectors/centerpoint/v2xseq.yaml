project:
  seed: 0
  data_root: data/v2x-seq-infrastructure
  converted_root: data/converted/v2x_seq_infrastructure
  output_root: outputs/centerpoint
  centerpoint_root: data/centerpoint_v2xseq
  openpcdet_root: third_party/OpenPCDet
  openpcdet_cfg: third_party/OpenPCDet/tools/cfgs/v2x_seq_models/centerpoint.yaml

split_file: configs/datasets/v2xseq_sequence_split.json

classes:
  - Car
  - Van
  - Bus
  - Truck
  - Pedestrian
  - Cyclist
  - Motorcyclist
  - Barrowlist

point_cloud_range: [0, -56.0, -5.0, 204.8, 40.0, 3.0]
voxel_size: [0.1, 0.1, 0.2]
max_points_per_voxel: 10
max_number_of_voxels: 60000

train:
  batch_size: 2
  epochs: 30
  workers: 4

evaluation:
  score_threshold: 0.1
  iou_thresholds:
    Car: 0.5
    Van: 0.5
    Bus: 0.5
    Truck: 0.5
    Pedestrian: 0.25
    Cyclist: 0.25
    Motorcyclist: 0.25
    Barrowlist: 0.25
