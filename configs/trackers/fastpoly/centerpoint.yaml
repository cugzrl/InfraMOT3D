project:
  seed: 0
  data_root: data/v2x-seq-infrastructure
  converted_root: data/converted/v2x_seq_infrastructure
  output_root: outputs/fastpoly_centerpoint

split_file: configs/datasets/v2xseq_sequence_split.json

input:
  type: detection
  detection_root: outputs/centerpoint/detections

tracker:
  name: Fast-Poly
  fastpoly_root: third_party/FastPoly
  class_names:
    - Car
    - Van
    - Bus
    - Truck
    - Pedestrian
    - Cyclist
    - Motorcyclist
    - Barrowlist
  fastpoly:
    basic:
      split: val
      has_velo: false
      LiDAR_interval: 0.1
      CLASS_NUM: 8
      Multiprocessing: false
    preprocessing:
      SF_thre: {0: 0.1600, 1: 0.1600, 2: 0.1200, 3: 0.1200, 4: 0.1900, 5: 0.1500, 6: 0.1600, 7: 0.1900}
      NMS_type: scale_nms
      NMS_thre: {0: 0.08, 1: 0.08, 2: 0.08, 3: 0.08, 4: 0.08, 5: 0.08, 6: 0.08, 7: 0.08}
      SCALE: {0: 1.0, 1: 1.0, 2: 1.0, 3: 1.0, 4: 1.1, 5: 1.4, 6: 1.0, 7: 1.1}
      NMS_metric:
        0: iou_bev
        1: iou_bev
        2: a_giou_bev
        3: a_giou_bev
        4: a_giou_bev
        5: a_giou_bev
        6: iou_bev
        7: a_giou_bev
      voxel_mask: true
      voxel_mask_size: {0: 5, 1: 5, 2: 5, 3: 5, 4: 5, 5: 5, 6: 5, 7: 5}
    association:
      category_metrics:
        0: a_giou_3d
        1: a_giou_3d
        2: a_giou_bev
        3: a_giou_3d
        4: a_giou_3d
        5: a_giou_3d
        6: a_giou_3d
        7: a_giou_3d
      second_metric: a_giou_bev
      two_stage: true
      first_thre: {0: 1.2100, 1: 1.2100, 2: 1.1600, 3: 1.2200, 4: 1.7800, 5: 1.6200, 6: 1.6000, 7: 1.7800}
      second_thre: {0: 1.0}
      algorithm: Hungarian
      voxel_mask: true
      voxel_mask_size: {0: 3, 1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 3, 7: 3}
    motion_model:
      filter:
        0: ExtendKalmanFilter
        1: ExtendKalmanFilter
        2: ExtendKalmanFilter
        3: ExtendKalmanFilter
        4: ExtendKalmanFilter
        5: ExtendKalmanFilter
        6: ExtendKalmanFilter
        7: ExtendKalmanFilter
      model:
        0: CTRA
        1: CTRA
        2: CTRA
        3: CTRA
        4: CTRA
        5: BICYCLE
        6: BICYCLE
        7: CTRA
    geometry_model:
      use: {0: true, 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true}
      filter:
        0: MedianModel
        1: MedianModel
        2: MedianModel
        3: MedianModel
        4: MeanModel
        5: MedianModel
        6: MedianModel
        7: MeanModel
      window_size: {0: 3, 1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 3, 7: 3}
    life_cycle:
      basic:
        max_age: {0: 15, 1: 15, 2: 10, 3: 20, 4: 10, 5: 10, 6: 20, 7: 10}
        min_hit: {0: 1, 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1, 7: 1}
        decay_rate: {0: 0.52, 1: 0.52, 2: 0.30, 3: 0.22, 4: 0.56, 5: 0.14, 6: 0.56, 7: 0.56}
      score:
        delete_thre: {0: 0.04, 1: 0.04, 2: 0.08, 3: 0.04, 4: 0.10, 5: 0.04, 6: 0.04, 7: 0.10}
        score_decay: {0: 0.26, 1: 0.26, 2: 0.24, 3: 0.28, 4: 0.18, 5: 0.24, 6: 0.28, 7: 0.18}
        predict_mode: Normal
        update_mode: Multi
        termination: average
    output:
      punish_num: 1
      post_nms: false
      NMS_thre: 0.08
      NMS_type: blend_nms
      NMS_metric: iou_bev
    debug:
      is_debug: false

evaluation:
  iou_thresholds:
    Car: 0.5
    Van: 0.5
    Bus: 0.5
    Truck: 0.5
    Pedestrian: 0.25
    Cyclist: 0.25
    Motorcyclist: 0.25
    Barrowlist: 0.25
